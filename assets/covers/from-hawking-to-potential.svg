<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900"><rect width="600" height="900" fill="#fdfbf7"/><text x="300" y="120" text-anchor="middle" font-family="Georgia" font-size="54" fill="#10264c">From</text><text x="300" y="220" text-anchor="middle" font-family="Georgia" font-size="92" font-weight="bold" fill="#10264c">Hawking</text><text x="300" y="290" text-anchor="middle" font-family="Georgia" font-size="36" fill="#10264c">to</text><text x="300" y="390" text-anchor="middle" font-family="Georgia" font-size="90" font-weight="bold" fill="#10264c">Potential</text><text x="300" y="450" text-anchor="middle" font-family="Arial" font-size="20" fill="#10264c">A boy from a royal family who sold on the</text><text x="300" y="480" text-anchor="middle" font-family="Arial" font-size="20" fill="#10264c">street and learned to win with potential</text><path d="M80 760 C220 650 120 680 300 610 S390 520 500 520" fill="none" stroke="#c9a24b" stroke-width="8"/><circle cx="430" cy="520" r="32" fill="none" stroke="#c9a24b" stroke-width="5"/><text x="300" y="840" text-anchor="middle" font-family="Arial" font-size="28" letter-spacing="7" fill="#10264c">KUFORIJI HARUN</text></svg>