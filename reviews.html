<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews | KHG Bookworks</title><meta name="description" content="Reviews from authors who worked with KHG Bookworks."><meta name="theme-color" content="#0E1F45"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/config.js"></script><script src="js/main.js" defer></script></head><body data-page="reviews"><main id="main"><div class="pg"><div class="wrap"><h1>Reviews</h1><p>Words from authors I have worked with.</p></div></div><section><div class="wrap"><div class="grid" id="rev"></div></div></section>
<section class="alt"><div class="wrap"><h2>Leave a review</h2><p class="lead">Reviews are checked before they appear.</p><form class="fm mt2" data-type="review" data-ok="Thank you. Your review will appear once approved."><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><label>Your name<input name="name" required></label><label>Book title or role<input name="role"></label><label>Service<select name="service"><option>Developmental Editing</option><option>Line Editing & Proofreading</option><option>Book Cover Design</option><option>Interior Formatting</option><option>Beta Reading</option><option>Book Trailer Videos</option><option>Ghostwriting</option><option>Author Marketing</option></select></label><fieldset style="border:0"><legend style="font-weight:600">Rating</legend><div class="stars"><input type="radio" id="r5" name="rating" value="5" required><label for="r5" title="5 stars">★</label><input type="radio" id="r4" name="rating" value="4"><label for="r4" title="4 stars">★</label><input type="radio" id="r3" name="rating" value="3"><label for="r3" title="3 stars">★</label><input type="radio" id="r2" name="rating" value="2"><label for="r2" title="2 stars">★</label><input type="radio" id="r1" name="rating" value="1"><label for="r1" title="1 stars">★</label></div></fieldset><label>Your review<textarea name="review" rows="4" maxlength="800" required></textarea></label><label class="ck"><input type="checkbox" name="consent" value="Yes" required> I agree to show this review on the website.</label><button class="btn" type="submit">Send review</button><div class="note" role="status"></div></form></div></section></main></body></html>
